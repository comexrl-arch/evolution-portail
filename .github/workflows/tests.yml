# Lance tous les scripts test_*.py hors ligne, sur chaque PR vers main et
# chaque push sur main. Aucun secret, aucune permission d'ecriture, aucun
# deploiement : chaque script tourne sans reseau (sudo unshare --net) et avec
# un environnement vide (env -i).

name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Lancer les tests hors ligne
        run: |
          shopt -s nullglob
          scripts=(test_*.py)
          [ ${#scripts[@]} -gt 0 ] || { echo "Aucun script de test trouvé"; exit 1; }
          python_bin="$(command -v python)"
          echec=0
          for f in "${scripts[@]}"; do
            echo "::group::$f"
            sudo unshare --net -- env -i PATH="$PATH" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" \
              PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 \
              "$python_bin" "$f" || { echo "::error::$f a échoué"; echec=1; }
            echo "::endgroup::"
          done
          exit $echec
